vision:
  data_root: data/processed/vision
  num_classes: 3
  batch_size: 16               # use 32 if GPU VRAM > 4 GB
  epochs: 50
  stage2_start: 15             # epoch to unfreeze top backbone layers
  dropout: 0.4
  gradient_checkpointing: true # mandatory — halves GPU memory usage
  label_smoothing: 0.1
  early_stopping_patience: 10
  img_size: 224

sensor:
  data_csv: data/raw/sensor_data.csv
  rf_n_estimators: 100
  rf_max_depth: 6
  rf_min_samples_leaf: 5
  xgb_n_estimators: 100
  xgb_max_depth: 6
  xgb_learning_rate: 0.1
  xgb_subsample: 0.8
  xgb_colsample_bytree: 0.8
  test_size: 0.15
  cv_folds: 5
  selection_metric: f1_macro   # metric used to pick RF vs XGBoost winner

fusion:
  weight_sensor: 0.55
  weight_vision: 0.45
  # Deterministic rule overrides in src/fuse.py take precedence over MSSI

datasets:
  mobilemold:    data/raw/mobilemold
  plantvillage:  data/raw/plantvillage
  fbsi:          data/raw/fbsi      # Mendeley manual download required
  bdhusk:        data/raw/bdhusk    # Mendeley manual download required
  sensor:        data/raw/sensor_data.csv
  processed_vision: data/processed/vision

wokwi:
  firmware: firmware/main.cpp
  diagram:  wokwi/diagram.json
  config:   wokwi/wokwi.toml

backend:
  sync_endpoint:      /api/v1/batch/sync
  qr_verify_endpoint: /api/v1/qr/verify
