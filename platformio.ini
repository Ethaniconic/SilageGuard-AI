; SilageGuard AI — PlatformIO Project Configuration
; SIH26111 | Software Category
;
; Build (real hardware):  pio run -e esp32-s3-devkitc-1
; Upload:                 pio run -e esp32-s3-devkitc-1 -t upload
; Monitor:                pio device monitor --baud 115200
;
; Build (Wokwi sim):      pio run -e wokwi
; Simulate in VS Code:    F1 -> "Wokwi: Start Simulator"

; src_dir is a [platformio]-level setting, NOT per-env.
; This tells PlatformIO to look for main.cpp in firmware/ not src/
[platformio]
src_dir = firmware

; ── Shared settings ───────────────────────────────────────────────────────────
[common]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.7
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0

; ── Real hardware target ──────────────────────────────────────────────────────
[env:esp32-s3-devkitc-1]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps      = ${common.lib_deps}
build_flags   =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ── Wokwi simulation target ───────────────────────────────────────────────────
; Activates #ifdef WOKWI in firmware/main.cpp:
;   - rawToMoisture() uses full 0-4095 range (potentiometer, not capacitive sensor)
;   - rawToPH() uses 1.65V neutral for 3.3V reference
; The wokwi/wokwi.toml points to the binary produced by THIS env.
[env:wokwi]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps      = ${common.lib_deps}
build_flags   =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DWOKWI
